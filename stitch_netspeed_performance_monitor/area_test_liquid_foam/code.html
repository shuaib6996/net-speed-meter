<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NetSpeed Meter - Area Test</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "secondary-fixed": "#d4e3ff",

                        "error": "#ffb4ab",
                        "surface-tint": "#00dfc1",

                        "on-secondary-fixed-variant": "#1e4879",
                        "on-tertiary-container": "#002f37",
                        "surface-container-low": "#191b26",
                        "surface-variant": "#32343f",

                        "primary-fixed": "#26fedc",
                        "on-background": "#e1e1f0",
                        "surface": "#11131d",
                        "on-surface-variant": "#c1c6d7",
                        "on-secondary-container": "#95baf3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["Inter", "sans-serif"]
                    }
                }
            }
        }

<style type="text/tailwindcss">
        @layer utilities {
            .glass-panel {
                @apply bg-white/[0.03] backdrop-blur-2xl border border-white/10 shadow-[0_8px_32px_rgba(0,0,0,0.3)];
            }
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
        .liquid-shape-1 { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
        .liquid-shape-2 { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
        .liquid-shape-3 { border-radius: 50% 50% 60% 40% / 40% 60% 40% 60%; }
        .liquid-shape-4 { border-radius: 30% 70% 50% 50% / 50% 40% 60% 50%; }
        .liquid-card { border-radius: 20px 40px 20px 40px / 40px 20px 40px 20px; }
        
        .animate-slow-spin { animation: spin 20s linear infinite; }
        .animate-slow-spin-reverse { animation: spin 25s linear infinite reverse; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#02050a] via-[#08121a] to-[#041a1f] text-on-surface font-body min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Ambient Background Graphic -->
<div class="fixed inset-0 z-0 pointer-events-none overflow-hidden flex items-center justify-center opacity-60">
<div class="w-[800px] h-[800px] liquid-shape-1 bg-primary/10 blur-[100px] absolute top-[-10%] right-[-10%] animate-slow-spin"></div>
<div class="w-[600px] h-[600px] liquid-shape-2 bg-tertiary/10 blur-[120px] absolute bottom-[10%] left-[-20%] animate-slow-spin-reverse"></div>
<div class="w-[500px] h-[500px] rounded-full bg-primary/5 blur-[90px] absolute top-[40%] left-[30%]"></div>
</div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-white/[0.02] backdrop-blur-xl border-b border-white/[0.05] shadow-[0_4px_30px_rgba(0,0,0,0.1)]">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary text-2xl" style="font-variation-settings: 'FILL' 1; text-shadow: 0 0 10px rgba(0,223,193,0.5);">speed</span>
<h1 class="text-xl font-black tracking-tighter text-primary font-['Manrope']" style="text-shadow: 0 0 10px rgba(0,223,193,0.3);">NetSpeed Meter</h1>
</div>
<div class="w-10 h-10 liquid-shape-3 bg-white/5 backdrop-blur-md flex items-center justify-center overflow-hidden border border-white/20 shadow-[inset_0_2px_4px_rgba(255,255,255,0.1)]">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center pt-24 pb-32 px-6 relative z-10">
<!-- Large Circular Speed Meter -->
<div class="relative flex items-center justify-center mb-12">
<!-- Outer Glow / Track -->
<div class="absolute w-[320px] h-[320px] liquid-shape-3 bg-white/[0.02] backdrop-blur-2xl border border-white/10 shadow-[inset_0_0_30px_rgba(0,223,193,0.15),0_8px_32px_rgba(0,0,0,0.4)] p-[2px] transition-all duration-1000 ease-in-out">
<div class="w-full h-full liquid-shape-3 bg-gradient-to-br from-white/[0.05] to-transparent shadow-[inset_0_2px_10px_rgba(255,255,255,0.05)]"></div>
</div>
<!-- Inner Readout Container -->
<div class="relative w-[280px] h-[280px] liquid-shape-4 bg-white/[0.03] flex flex-col items-center justify-center shadow-[inset_0_2px_20px_rgba(255,255,255,0.1),inset_0_-10px_30px_rgba(0,223,193,0.1),0_10px_40px_rgba(0,0,0,0.5)] z-10 border border-white/20 backdrop-blur-3xl transition-all duration-1000 ease-in-out">
<!-- Foam Highlight -->
<div class="absolute top-2 left-10 right-10 h-8 liquid-shape-1 bg-white/10 blur-[4px]"></div>
<span class="font-label text-[10px] font-semibold uppercase tracking-widest text-on-surface-variant mb-2 relative z-10">Current Ping</span>
<div class="flex items-baseline gap-1 relative z-10">
<span class="font-headline text-[4rem] font-extrabold leading-none tracking-tighter text-on-surface" style="text-shadow: 0 0 20px rgba(255,255,255,0.2);">--</span>
</div>
<span class="font-label text-sm uppercase tracking-widest text-primary/70 mt-1 relative z-10">ms</span>
</div>
<!-- Decorative Inner Ring -->
<div class="absolute inset-4 w-[240px] h-[240px] liquid-shape-2 border border-primary/20 z-0 opacity-50 blur-[1px]"></div>
</div>
<!-- Start Test Action -->
<button class="bg-white/10 backdrop-blur-xl text-primary font-body font-semibold text-sm uppercase tracking-widest liquid-card px-12 py-4 shadow-[0_8px_32px_rgba(0,223,193,0.2),inset_0_2px_5px_rgba(255,255,255,0.2)] border border-white/20 mb-16 relative overflow-hidden group hover:bg-white/20 transition-all duration-300">
<span class="relative z-10" style="text-shadow: 0 0 10px rgba(0,223,193,0.4);">Start Test</span>
<div class="absolute inset-0 bg-gradient-to-t from-primary/20 to-transparent translate-y-full group-hover:translate-y-0 transition-transform duration-500 ease-out z-0"></div>
<!-- Foam Highlight -->
<div class="absolute top-0 left-4 right-4 h-2 bg-white/20 blur-[2px] rounded-full"></div>
</button>
<!-- Results Placeholders (Bento Grid Style) -->
<div class="w-full max-w-md grid grid-cols-2 gap-5">
<!-- Download Metric -->
<div class="liquid-card bg-white/[0.03] backdrop-blur-xl p-6 flex flex-col relative overflow-hidden border border-white/10 shadow-[inset_0_2px_15px_rgba(255,255,255,0.05),inset_0_-5px_15px_rgba(0,223,193,0.05),0_8px_20px_rgba(0,0,0,0.2)]">
<!-- Foam Highlight -->
<div class="absolute top-1 left-4 right-4 h-3 bg-white/10 blur-[3px] rounded-full"></div>
<div class="absolute -top-10 -left-10 w-24 h-24 bg-primary/20 blur-[20px] rounded-full"></div>
<div class="flex items-center gap-2 mb-4 relative z-10">
<span class="material-symbols-outlined text-primary text-sm drop-shadow-[0_0_5px_rgba(0,223,193,0.5)]">download</span>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-primary drop-shadow-[0_0_5px_rgba(0,223,193,0.5)]">Download</span>
</div>
<div class="flex items-baseline gap-1 mt-auto relative z-10">
<span class="font-headline text-3xl font-bold text-on-surface">--</span>
<span class="font-label text-xs text-on-surface-variant">Mbps</span>
</div>
</div>
<!-- Upload Metric -->
<div class="liquid-card bg-white/[0.03] backdrop-blur-xl p-6 flex flex-col relative overflow-hidden border border-white/10 shadow-[inset_0_2px_15px_rgba(255,255,255,0.05),inset_0_-5px_15px_rgba(0,218,248,0.05),0_8px_20px_rgba(0,0,0,0.2)]">
<!-- Foam Highlight -->
<div class="absolute top-1 left-4 right-4 h-3 bg-white/10 blur-[3px] rounded-full"></div>
<div class="absolute -bottom-10 -right-10 w-24 h-24 bg-tertiary/20 blur-[20px] rounded-full"></div>
<div class="flex items-center gap-2 mb-4 relative z-10">
<span class="material-symbols-outlined text-tertiary text-sm drop-shadow-[0_0_5px_rgba(0,218,248,0.5)]">upload</span>
<span class="font-label text-[10px] font-bold uppercase tracking-widest text-tertiary drop-shadow-[0_0_5px_rgba(0,218,248,0.5)]">Upload</span>
</div>
<div class="flex items-baseline gap-1 mt-auto relative z-10">
<span class="font-headline text-3xl font-bold text-on-surface">--</span>
<span class="font-label text-xs text-on-surface-variant">Mbps</span>
</div>
</div>
</div>
<!-- View History Link -->
<a class="mt-8 flex items-center gap-2 text-sm font-label font-medium text-on-surface-variant hover:text-primary transition-colors drop-shadow-[0_0_8px_rgba(255,255,255,0.1)]" href="#">
<span class="material-symbols-outlined text-lg">history</span>
            View Test History
        </a>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-white/[0.03] backdrop-blur-2xl rounded-[40px_40px_0_0] shadow-[0_-10px_40px_rgba(0,0,0,0.3)] border-t border-white/10">
<!-- Foam Highlight for Nav -->
<div class="absolute top-0 left-[10%] right-[10%] h-[1px] bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
<!-- Inactive: Home -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-primary transition-all gap-1 group relative z-10" href="#">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform drop-shadow-md">home</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Home</span>
</a>
<!-- Active: Test -->
<a class="flex flex-col items-center justify-center text-primary bg-white/[0.08] backdrop-blur-md border border-white/20 shadow-[inset_0_2px_10px_rgba(255,255,255,0.1),0_4px_15px_rgba(0,223,193,0.2)] liquid-card px-5 py-2 gap-1 scale-105 relative z-10" href="#">
<!-- Foam Highlight inside Active Nav -->
<div class="absolute top-1 left-2 right-2 h-1 bg-white/20 blur-[1px] rounded-full"></div>
<span class="material-symbols-outlined text-2xl drop-shadow-[0_0_5px_rgba(0,223,193,0.5)]" style="font-variation-settings: 'FILL' 1;">speed</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest drop-shadow-[0_0_5px_rgba(0,223,193,0.5)]">Test</span>
</a>
<!-- Inactive: History -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-primary transition-all gap-1 group relative z-10" href="#">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform drop-shadow-md">history</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">History</span>
</a>
<!-- Inactive: Settings -->
<a class="flex flex-col items-center justify-center text-slate-400 hover:text-primary transition-all gap-1 group relative z-10" href="#">
<span class="material-symbols-outlined text-2xl group-hover:scale-110 transition-transform drop-shadow-md">settings</span>
<span class="font-['Inter'] text-[10px] font-semibold uppercase tracking-widest">Settings</span>
</a>
</nav>
